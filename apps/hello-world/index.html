<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1017;
      color: #e6e9ef;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      padding: 40px;
      border-radius: 20px;
      background: #161a22;
      border: 1px solid #262c38;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { color: #9aa3b2; margin: 0 0 24px; }
    button {
      font-size: 1rem;
      padding: 10px 22px;
      border: none;
      border-radius: 999px;
      background: #8b8cf6;
      color: #0d1017;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:hover { transform: translateY(-2px); }
    .count { margin-top: 20px; font-size: 0.9rem; color: #9aa3b2; }
    a.back { display: inline-block; margin-top: 28px; color: #8b8cf6; text-decoration: none; font-size: 0.9rem; }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello World</h1>
    <p>This is an example subpage. Copy this folder, rename it, and add an entry in <code>apps.json</code> to publish a new app.</p>
    <button id="btn">Click me</button>
    <div class="count" id="count">Clicks: 0</div>
    <a class="back" href="../../">← Back to home</a>
  </div>
  <script>
    let n = 0;
    document.getElementById('btn').addEventListener('click', () => {
      n++;
      document.getElementById('count').textContent = 'Clicks: ' + n;
    });
  </script>
</body>
</html>
