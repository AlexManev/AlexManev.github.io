<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Alex Manev</title>
  <meta name="description" content="A home for my web apps, experiments, and projects." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --fill: rgba(118, 118, 128, 0.12);
      --separator: rgba(60, 60, 67, 0.18);
      --text: #000000;
      --muted: rgba(60, 60, 67, 0.6);
      --accent: #007aff;
      --pill: rgba(118, 118, 128, 0.12);
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 12px 36px rgba(0, 0, 0, 0.16);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1c1c1e;
        --fill: rgba(118, 118, 128, 0.24);
        --separator: rgba(84, 84, 88, 0.6);
        --text: #ffffff;
        --muted: rgba(235, 235, 245, 0.6);
        --accent: #0a84ff;
        --pill: rgba(118, 118, 128, 0.28);
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        --shadow-hover: 0 12px 36px rgba(0, 0, 0, 0.7);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .wrap { max-width: 1024px; margin: 0 auto; padding: 0 20px; }

    /* ---------- Large-title header ---------- */
    header { padding: 48px 0 12px; }
    .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    .eyebrow {
      margin: 0 0 2px;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    header h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .avatar {
      flex: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 0.95rem; font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #5e5ce6, #bf5af2);
      margin-bottom: 4px;
    }
    .tagline { margin: 6px 0 0; color: var(--muted); font-size: 1rem; }
    .profile-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .profile-links:empty { display: none; }
    .profile-links a {
      padding: 5px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--pill);
      border-radius: 999px;
    }
    .profile-links a:hover { filter: brightness(0.95); }

    /* ---------- Search ---------- */
    .search-box { position: relative; margin: 16px 0 8px; }
    .search-box svg {
      position: absolute; left: 10px; top: 50%;
      width: 17px; height: 17px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .search {
      width: 100%;
      padding: 9px 12px 9px 34px;
      font: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--fill);
      border: 0;
      border-radius: 10px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .search:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
    .search::placeholder { color: var(--muted); }

    /* ---------- Section headers ---------- */
    .section { margin-top: 28px; }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--separator);
      margin-bottom: 12px;
    }
    .section-head h2 { margin: 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.015em; }
    .section-head .sub { margin: 2px 0 0; font-size: 0.9rem; color: var(--muted); }
    .count { font-size: 0.95rem; color: var(--muted); white-space: nowrap; }

    /* ---------- Featured carousel ---------- */
    .featured {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: min(88%, 460px);
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding: 0 20px;
      margin: 0 -20px;
      padding: 4px 20px 20px;
      scrollbar-width: none;
    }
    .featured::-webkit-scrollbar { display: none; }
    .feature {
      scroll-snap-align: start;
      position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 300px;
      padding: 20px;
      border-radius: 20px;
      color: #fff;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .feature:hover { transform: scale(1.015); box-shadow: var(--shadow-hover); }
    .feature:active { transform: scale(0.98); }
    .feature .big-emoji {
      position: absolute; right: -12px; top: 36px;
      font-size: 150px; line-height: 1;
      opacity: 0.95;
      transform: rotate(-8deg);
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.25));
      pointer-events: none;
    }
    .feature .kicker {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      opacity: 0.85;
    }
    .feature h3 {
      margin: 4px 0 0;
      max-width: 70%;
      font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.15);
    }
    .feature .foot {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      margin: 0 -20px -20px;
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.22);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    .feature .foot p {
      margin: 0; flex: 1; min-width: 0;
      font-size: 0.85rem; opacity: 0.92;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .feature .get { background: rgba(255, 255, 255, 0.92); color: #000; }

    /* ---------- App list (rows) ---------- */
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      column-gap: 28px;
    }
    .row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 0;
      min-width: 0;
    }
    .row .meta {
      flex: 1; min-width: 0;
      align-self: stretch;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--separator);
      padding: 2px 0 12px;
      margin-bottom: -10px;
    }
    .row .text { flex: 1; min-width: 0; }
    .row h3 {
      margin: 0;
      font-size: 1rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row p {
      margin: 2px 0 0;
      font-size: 0.82rem; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .row .cat { margin-top: 3px; font-size: 0.75rem; color: var(--muted); text-transform: capitalize; }
    .row:hover .get { filter: brightness(0.93); }

    .icon {
      flex: none;
      width: 64px; height: 64px;
      border-radius: 22.5%;
      display: grid; place-items: center;
      font-size: 34px; line-height: 1;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.12);
    }

    .get {
      flex: none;
      min-width: 72px;
      padding: 6px 16px;
      font-size: 0.88rem; font-weight: 700;
      text-align: center; text-transform: uppercase;
      letter-spacing: 0.01em;
      color: var(--accent);
      background: var(--pill);
      border-radius: 999px;
    }

    .empty, .error {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      grid-column: 1 / -1;
    }
    .error code { font-family: ui-monospace, monospace; color: var(--accent); }

    footer {
      margin: 56px 0 40px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--accent); }
    footer a:hover { text-decoration: underline; }

    @media (min-width: 720px) {
      header { padding-top: 64px; }
      .featured {
        grid-auto-columns: calc((100% - 40px - 16px) / 2);
        margin: 0; padding: 4px 0 20px;
        scroll-padding: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .feature { transition: none; }
      .feature:hover, .feature:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow" id="date"></p>
      <div class="title-row">
        <h1 id="name">Alex Manev</h1>
        <a class="avatar" id="avatar" aria-label="Profile">AM</a>
      </div>
      <p class="tagline" id="tagline">A home for my web apps, experiments, and projects.</p>
      <nav class="profile-links" id="profile-links"></nav>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input type="search" class="search" id="search" placeholder="Apps, tags and more" aria-label="Search apps" />
      </div>
    </header>

    <main>
      <section class="section" id="featured-section" hidden>
        <div class="section-head">
          <div>
            <h2>Featured</h2>
            <p class="sub">The newest additions</p>
          </div>
        </div>
        <div class="featured" id="featured"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 id="list-title">All Apps</h2>
          <span class="count" id="count"></span>
        </div>
        <div class="list" id="grid"></div>
      </section>
    </main>

    <footer>
      Built with a static index &middot; add new apps by editing
      <a href="https://github.com/AlexManev/AlexManev.github.io/blob/main/apps.json"><code style="all:unset;font-family:monospace;">apps.json</code></a>
    </footer>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const featuredEl = document.getElementById('featured');
    const featuredSection = document.getElementById('featured-section');
    const listTitle = document.getElementById('list-title');
    const searchEl = document.getElementById('search');
    const countEl = document.getElementById('count');
    const FEATURED_COUNT = 3;
    let apps = [];

    // A stable, per-app gradient so every icon gets its own colour without
    // needing one in apps.json. An optional "hue" (0–360) on an entry wins.
    function hueFor(app) {
      if (typeof app.hue === 'number') return app.hue;
      let h = 0;
      for (const c of (app.title || app.path || '')) h = (h * 31 + c.codePointAt(0)) >>> 0;
      return h % 360;
    }
    function gradient(app, light, dark) {
      const h = hueFor(app);
      return `linear-gradient(145deg, hsl(${h} 85% ${light}%), hsl(${(h + 40) % 360} 80% ${dark}%))`;
    }
    function category(app) {
      const t = (app.tags && app.tags[0]) || 'App';
      return t.length <= 3 ? t.toUpperCase() : t;
    }

    function renderFeatured(list) {
      featuredEl.innerHTML = '';
      for (const app of list) {
        const a = document.createElement('a');
        a.className = 'feature';
        a.href = app.path;
        a.style.background = gradient(app, 52, 38);
        a.innerHTML = `
          ${app.emoji ? `<div class="big-emoji" aria-hidden="true">${escapeHtml(app.emoji)}</div>` : ''}
          <div>
            <div class="kicker">New &middot; ${escapeHtml(category(app))}</div>
            <h3>${escapeHtml(app.title || app.path)}</h3>
          </div>
          <div class="foot">
            <p>${escapeHtml(app.description || '')}</p>
            <span class="get">Open</span>
          </div>
        `;
        featuredEl.appendChild(a);
      }
      featuredSection.hidden = !list.length;
    }

    function render(list) {
      grid.innerHTML = '';
      if (!list.length) {
        grid.innerHTML = '<div class="empty">No apps match your search.</div>';
        return;
      }
      for (const app of list) {
        const a = document.createElement('a');
        a.className = 'row';
        a.href = app.path;
        a.innerHTML = `
          <div class="icon" style="background:${gradient(app, 62, 46)}" aria-hidden="true">${escapeHtml(app.emoji || '✨')}</div>
          <div class="meta">
            <div class="text">
              <h3>${escapeHtml(app.title || app.path)}</h3>
              <p>${escapeHtml(app.description || '')}</p>
              <div class="cat">${escapeHtml(category(app))}</div>
            </div>
            <span class="get">Open</span>
          </div>
        `;
        grid.appendChild(a);
      }
    }

    function applyFilter() {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) {
        featuredSection.hidden = !apps.length;
        listTitle.textContent = 'All Apps';
        setCount(apps.length);
        render(apps);
        return;
      }
      const filtered = apps.filter(app => {
        const hay = [app.title, app.description, ...(app.tags || [])].join(' ').toLowerCase();
        return hay.includes(q);
      });
      featuredSection.hidden = true;
      listTitle.textContent = 'Results';
      setCount(filtered.length);
      render(filtered);
    }

    function setCount(n) {
      countEl.textContent = n + (n === 1 ? ' app' : ' apps');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function renderProfile(profile) {
      if (!profile) return;
      if (profile.name) {
        document.getElementById('name').textContent = profile.name;
        document.title = profile.name;
        document.getElementById('avatar').textContent =
          profile.name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      }
      if (profile.tagline) document.getElementById('tagline').textContent = profile.tagline;
      const links = profile.links || [];
      if (links[0]) {
        const avatar = document.getElementById('avatar');
        avatar.href = links[0].url;
        avatar.setAttribute('aria-label', links[0].label);
      }
      const nav = document.getElementById('profile-links');
      nav.innerHTML = '';
      for (const link of links) {
        const a = document.createElement('a');
        a.href = link.url;
        a.textContent = link.label;
        nav.appendChild(a);
      }
    }

    document.getElementById('date').textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', day: 'numeric', month: 'long'
    });

    fetch('apps.json', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('apps.json not found'); return r.json(); })
      .then(data => {
        renderProfile(data.profile);
        apps = data.apps || [];
        setCount(apps.length);
        renderFeatured(apps.slice(0, FEATURED_COUNT));
        render(apps);
      })
      .catch(err => {
        grid.innerHTML = '<div class="error">Could not load <code>apps.json</code>.<br>' +
          escapeHtml(err.message) + '</div>';
      });

    searchEl.addEventListener('input', applyFilter);
  </script>
</body>
</html>
